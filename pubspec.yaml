name: marg_app
description: "MARG — temple discovery and pilgrimage companion."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  cached_network_image: ^3.4.1
  connectivity_plus: ^7.2.0
  device_info_plus: ^13.2.0
  dio: ^5.10.0
  drift: ^2.34.1
  drift_flutter: ^0.3.1
  firebase_analytics: ^12.4.4
  firebase_auth: ^6.5.5
  firebase_core: ^4.12.0
  firebase_crashlytics: ^5.2.5
  firebase_messaging: ^16.4.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.2.2
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^10.3.1
  flutter_svg: ^2.3.0
  freezed_annotation: ^3.1.0
  geolocator: ^14.0.3
  go_router: ^17.3.0
  google_fonts: ^8.1.0
  google_maps_flutter: ^2.17.1
  google_sign_in: ^6.1.0
  image_picker: ^1.1.2
  intl: 0.20.2 # pinned by flutter_localizations (SDK)
  json_annotation: ^4.12.0
  latlong2: ^0.9.1
  material_symbols_icons: ^4.2951.0
  package_info_plus: ^10.2.0
  path_provider: ^2.1.5
  permission_handler: ^12.0.3
  pinput: ^6.0.2
  qr_flutter: ^4.1.0
  retrofit: ^4.9.2
  share_plus: ^13.2.0
  shared_preferences: ^2.5.5
  shimmer: ^3.0.0
  url_launcher: ^6.3.2

dev_dependencies:
  build_runner: ^2.15.1
  drift_dev: ^2.34.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  retrofit_generator: ^10.2.7

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/images/home/
    - assets/images/icons/
    - assets/images/deities/
    - assets/images/categories/
    - assets/images/illustrations/
    - assets/icons/
    - assets/lottie/
    - assets/animations/
    - assets/translations/
    - assets/map_styles/
    - assets/geo/
    - assets/temples/
    - assets/branding/logo/
    - assets/branding/social/
    - assets/branding/splash/

# Launcher icon — generated from the official logo (tool/art/icon/marg_source.png).
# Regenerate: dart run flutter_launcher_icons
flutter_launcher_icons:
  # Built by tool/art/make_brand_icons.py from the official mark: the full icon
  # (cream + mark), and the adaptive foreground/monochrome already sized to the
  # 66dp safe zone (hence no extra inset).
  image_path: "tool/art/icon/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#FDF9F3"
  min_sdk_android: 21
  adaptive_icon_background: "#FDF9F3"
  adaptive_icon_foreground: "tool/art/icon/app_icon_foreground.png"
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: "tool/art/icon/app_icon_monochrome.png"

# Native splash — MARG mark centred on the brand cream background.
# The generated splash assets are committed. flutter_native_splash is NOT a
# runtime dependency (its 2.4.x Android plugin declaration breaks release
# builds); to regenerate, temporarily add it to dev_dependencies, run
# `dart run flutter_native_splash:create`, then remove it again.
flutter_native_splash:
  color: "#FDF9F3"
  image: "assets/branding/logo/marg_mark.png"
  android: true
  ios: true
  android_12:
    image: "assets/branding/logo/marg_mark.png"
    color: "#FDF9F3"
